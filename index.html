<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 상태 모니터링</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .modern-font {
            font-family: 'Outfit', sans-serif;
        }
        
        :root {
            --bg-main: #FBF9F5;
            --bg-card: #FFFFFF;
            --border-card: #EFECE6;
            --text-main: #2D2A26;
            --text-sub: #78716C;
            --accent-warm: #E07A5F;
            --accent-sub: #F4F1EA;
        }
        [data-theme="dark"] {
            --bg-main: #1C1A18;
            --bg-card: #262421;
            --border-card: #383531;
            --text-main: #F5F2EC;
            --text-sub: #A8A29E;
            --accent-warm: #E07A5F;
            --accent-sub: #332F2C;
        }

        .warm-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            box-shadow: 0 10px 30px -5px rgba(45, 42, 38, 0.04);
        }
    </style>
</head>
<body style="background-color: var(--bg-main); color: var(--text-main);" class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b sticky top-0 z-50 backdrop-blur-md" style="border-color: var(--border-card); background-color: var(--bg-main)/80;">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-[#E07A5F] flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-eye text-lg"></i>
                </div>
                <div>
                    <span class="modern-font text-lg font-bold">상태 모니터링</span>
                    <span class="block text-[10px] uppercase opacity-60">실시간 현황판</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <select id="langSelect" class="border text-xs rounded-xl px-3 py-2 outline-none cursor-pointer" style="background-color: var(--accent-sub); border-color: var(--border-card); color: var(--text-main);">
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="en">🇺🇸 English</option>
                </select>

                <button id="themeToggle" class="w-10 h-10 rounded-xl border flex items-center justify-center" style="background-color: var(--accent-sub); border-color: var(--border-card);">
                    <i id="themeIcon" class="fa-solid fa-sun text-amber-500 text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8 items-start w-full">
        
        <!-- Left: Webcam -->
        <div class="lg:col-span-7 flex flex-col space-y-6">
            <div class="warm-card rounded-3xl p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="modern-font text-sm font-bold flex items-center space-x-2">
                        <i class="fa-solid fa-video text-[#E07A5F]"></i>
                        <span data-i18n="feedTitle">실시간 카메라 영상</span>
                    </h2>
                    
                    <!-- 카메라 ON/OFF 토글 버튼 -->
                    <button id="camToggleBtn" onclick="toggleCamera()" class="bg-[#E07A5F] hover:bg-[#d06b50] text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-md text-xs flex items-center space-x-2">
                        <i id="camBtnIcon" class="fa-solid fa-play"></i>
                        <span id="camBtnText" data-i18n="startBtn">카메라 시작하기</span>
                    </button>
                </div>

                <div class="relative aspect-video w-full bg-black/5 rounded-2xl overflow-hidden border flex items-center justify-center">
                    <div id="webcam-container" class="w-full h-full flex items-center justify-center">
                        <div id="placeholderText" class="text-center p-6 opacity-40 flex flex-col items-center space-y-3">
                            <i class="fa-solid fa-camera text-4xl text-[#E07A5F]"></i>
                            <p class="text-xs" data-i18n="placeholder">버튼을 눌러 카메라를 연결하세요.</p>
                        </div>
                    </div>
                    <div class="absolute top-4 left-4 border px-3 py-1.5 rounded-full text-[11px] font-medium flex items-center space-x-2 shadow-sm" style="background-color: var(--bg-card); border-color: var(--border-card);">
                        <span class="w-2 h-2 rounded-full bg-amber-500" id="statusDot"></span>
                        <span id="statusText" data-i18n="statusStandby">대기 중</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Status Display (수치 전면 제거, 오직 상태명만 표시) -->
        <div class="lg:col-span-5 flex flex-col space-y-6">
            <div class="warm-card rounded-3xl p-6 flex flex-col items-center text-center">
                <h2 class="modern-font text-sm font-bold flex items-center space-x-2 mb-6 w-full justify-start">
                    <i class="fa-solid fa-chart-simple text-[#E07A5F]"></i>
                    <span data-i18n="analyticsTitle">현재 인식 상태</span>
                </h2>

                <div class="relative w-48 h-48 my-4 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full border-4 border-dashed border-[#E07A5F]/30"></div>
                    <div class="absolute inset-3 rounded-full flex flex-col items-center justify-center p-4 shadow-inner" style="background-color: var(--accent-sub);">
                        <span class="text-[11px] font-semibold uppercase opacity-60 mb-1" data-i18n="currentState">현재 상태</span>
                        <!-- 수치 없이 오직 상태명만 크게 출력 -->
                        <span id="coreMainClassName" class="modern-font text-2xl font-bold text-[#E07A5F] truncate max-w-[150px]">-</span>
                    </div>
                </div>

                <div class="w-full mt-4 pt-4 border-t text-xs text-left opacity-60" style="border-color: var(--border-card);" data-i18n="guideText">
                    * 카메라 화면을 분석하여 해당하는 상태(예: 적음, 많음)를 표시합니다.
                </div>
            </div>

            <!-- 하단 상태 목록 칩 (수치 없음) -->
            <div id="label-container" class="warm-card rounded-2xl p-4 grid grid-cols-2 gap-3">
                <div class="col-span-2 text-center py-4 text-xs opacity-40 font-medium" data-i18n="waitingModel">
                    모델 로딩 대기 중...
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t py-6 text-center text-xs opacity-50" style="border-color: var(--border-card);">
        <p>&copy; 2026 AI MONITORING SYSTEM. ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const translations = {
            ko: {
                feedTitle: "실시간 카메라 영상",
                startBtn: "카메라 시작하기",
                stopBtn: "카메라 끄기",
                placeholder: "버튼을 눌러 카메라를 연결하세요.",
                statusStandby: "대기 중",
                statusActive: "분석 작동 중",
                analyticsTitle: "현재 인식 상태",
                currentState: "현재 상태",
                guideText: "* 카메라 화면을 분석하여 해당하는 상태(예: 적음, 많음)를 표시합니다.",
                waitingModel: "모델 로딩 대기 중..."
            },
            en: {
                feedTitle: "Live Camera Stream",
                startBtn: "Start Camera",
                stopBtn: "Stop Camera",
                placeholder: "Click to connect camera.",
                statusStandby: "Standby",
                statusActive: "Monitoring",
                analyticsTitle: "Current Status",
                currentState: "Status",
                guideText: "* Displays the detected state (e.g., low, high) in real time.",
                waitingModel: "Waiting for model..."
            }
        };

        let currentLang = 'ko';
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            updateTexts();
        });

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
            if (isCameraOn) {
                document.getElementById('camBtnText').innerText = translations[currentLang].stopBtn;
                document.getElementById('statusText').innerText = translations[currentLang].statusActive;
            } else {
                document.getElementById('camBtnText').innerText = translations[currentLang].startBtn;
                document.getElementById('statusText').innerText = translations[currentLang].statusStandby;
            }
        }

        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                htmlElement.setAttribute('data-theme', 'dark');
                themeIcon.className = "fa-solid fa-moon text-indigo-300 text-sm";
            } else {
                htmlElement.setAttribute('data-theme', 'light');
                themeIcon.className = "fa-solid fa-sun text-amber-500 text-sm";
            }
        });

        const URL = "https://teachablemachine.withgoogle.com/models/QUqC192tV/";
        const BASE_URL = URL.endsWith('/') ? URL : URL + '/';

        let model, webcam, maxPredictions;
        let isModelLoaded = false;
        let isCameraOn = false;
        let animationId = null;

        async function toggleCamera() {
            if (!isCameraOn) {
                await startCamera();
            } else {
                stopCamera();
            }
        }

        async function startCamera() {
            const camBtnText = document.getElementById('camBtnText');
            const camBtnIcon = document.getElementById('camBtnIcon');
            const camToggleBtn = document.getElementById('camToggleBtn');
            
            camToggleBtn.disabled = true;
            camBtnText.innerText = "연결 중...";

            try {
                if (!isModelLoaded) {
                    model = await tmImage.load(BASE_URL + "model.json", BASE_URL + "metadata.json");
                    maxPredictions = model.getTotalClasses();
                    isModelLoaded = true;
                }

                if (!webcam) {
                    webcam = new tmImage.Webcam(420, 315, true);
                    await webcam.setup();
                }
                
                await webcam.play();
                
                const webcamContainer = document.getElementById("webcam-container");
                webcamContainer.innerHTML = "";
                webcamContainer.appendChild(webcam.canvas);

                isCameraOn = true;
                document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]";
                document.getElementById('statusText').innerText = translations[currentLang].statusActive;
                
                camBtnIcon.className = "fa-solid fa-stop";
                camBtnText.innerText = translations[currentLang].stopBtn;
                camToggleBtn.disabled = false;

                window.requestAnimationFrame(loop);

            } catch (error) {
                console.error("Camera error:", error);
                alert("카메라를 연결하거나 모델을 불러오지 못했습니다.");
                camToggleBtn.disabled = false;
                camBtnIcon.className = "fa-solid fa-play";
                camBtnText.innerText = translations[currentLang].startBtn;
            }
        }

        function stopCamera() {
            if (webcam) webcam.stop();
            if (animationId) cancelAnimationFrame(animationId);
            isCameraOn = false;

            document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-amber-500";
            document.getElementById('statusText').innerText = translations[currentLang].statusStandby;

            document.getElementById('camBtnIcon').className = "fa-solid fa-play";
            document.getElementById('camBtnText').innerText = translations[currentLang].startBtn;

            document.getElementById("webcam-container").innerHTML = `
                <div id="placeholderText" class="text-center p-6 opacity-40 flex flex-col items-center space-y-3">
                    <i class="fa-solid fa-camera text-4xl text-[#E07A5F]"></i>
                    <p class="text-xs">${translations[currentLang].placeholder}</p>
                </div>
            `;

            document.getElementById('coreMainClassName').innerText = "-";
            document.getElementById('label-container').innerHTML = `
                <div class="col-span-2 text-center py-4 text-xs opacity-40 font-medium">
                    ${translations[currentLang].waitingModel}
                </div>
            `;
        }

        async function loop() {
            if (!isCameraOn) return;
            webcam.update();
            await predict();
            animationId = window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!isCameraOn) return;
            const prediction = await model.predict(webcam.canvas);
            
            let topPrediction = prediction[0];
            for (let i = 1; i < maxPredictions; i++) {
                if (prediction[i].probability > topPrediction.probability) {
                    topPrediction = prediction[i];
                }
            }

            // 오직 상태 이름만 출력 (수치 및 퍼센트 제거 완료)
            document.getElementById('coreMainClassName').innerText = topPrediction.className;

            let subHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const isActive = prediction[i].className === topPrediction.className;
                const activeStyle = isActive ? "border-[#E07A5F] bg-[#E07A5F]/10 font-bold text-[#E07A5F]" : "opacity-60";
                
                subHTML += `
                    <div class="p-2.5 rounded-xl border flex items-center justify-center text-xs transition-all ${activeStyle}" style="border-color: var(--border-card);">
                        <span class="truncate">${prediction[i].className}</span>
                    </div>
                `;
            }
            document.getElementById('label-container').innerHTML = subHTML;
        }
    </script>
</body>
</html>
