<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-VISION | Modern Warm AI Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .modern-font {
            font-family: 'Outfit', sans-serif;
        }
        
        /* 라이트/다크 모드 웜톤 컬러 변수 테마 */
        :root {
            --bg-main: #FBF9F5;
            --bg-card: #FFFFFF;
            --border-card: #EFECE6;
            --text-main: #2D2A26;
            --text-sub: #78716C;
            --accent-warm: #E07A5F;
            --accent-sub: #F4F1EA;
        }
        [data-theme="dark"] {
            --bg-main: #1C1A18;
            --bg-card: #262421;
            --border-card: #383531;
            --text-main: #F5F2EC;
            --text-sub: #A8A29E;
            --accent-warm: #E07A5F;
            --accent-sub: #332F2C;
        }

        .warm-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            box-shadow: 0 10px 30px -5px rgba(45, 42, 38, 0.04);
        }

        @keyframes pulse-core {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .pulse-reactor {
            animation: pulse-core 2s infinite ease-in-out;
        }
    </style>
</head>
<body style="background-color: var(--bg-main); color: var(--text-main);" class="min-h-screen flex flex-col justify-between selection:bg-[#E07A5F] selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b transition-colors duration-300 backdrop-blur-md sticky top-0 z-50" style="border-color: var(--border-card); background-color: var(--bg-main)/80;">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-[#E07A5F] flex items-center justify-center shadow-md shadow-[#E07A5F]/20 text-white">
                    <i class="fa-solid fa-seedling text-lg"></i>
                </div>
                <div>
                    <span class="modern-font text-lg font-bold tracking-tight">NEO-VISION</span>
                    <span class="block text-[10px] tracking-widest font-semibold uppercase opacity-60" data-i18n="subtitle">Warm AI Studio</span>
                </div>
            </div>

            <!-- Controls: Theme & Language -->
            <div class="flex items-center space-x-3">
                <select id="langSelect" class="border text-xs rounded-xl px-3 py-2 outline-none cursor-pointer transition font-medium" style="background-color: var(--accent-sub); border-color: var(--border-card); color: var(--text-main);">
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="en">🇺🇸 English</option>
                </select>

                <!-- 낮/밤 직관적 아이콘 테마 토글 버튼 -->
                <button id="themeToggle" class="w-10 h-10 rounded-xl border flex items-center justify-center transition hover:scale-105 active:scale-95" style="background-color: var(--accent-sub); border-color: var(--border-card);">
                    <i id="themeIcon" class="fa-solid fa-sun text-amber-500 text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-6 py-8 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8 items-start w-full">
        
        <!-- Left: Webcam & Controls -->
        <div class="lg:col-span-7 flex flex-col space-y-6">
            <div class="warm-card rounded-3xl p-6 relative overflow-hidden">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="modern-font text-sm font-bold flex items-center space-x-2 tracking-wide">
                        <i class="fa-solid fa-camera-retro text-[#E07A5F]"></i>
                        <span data-i18n="feedTitle">OPTICAL SENSOR STREAM</span>
                    </h2>
                    
                    <button id="startBtn" onclick="init()" class="bg-[#E07A5F] hover:bg-[#d06b50] text-white font-semibold px-5 py-2.5 rounded-xl shadow-md shadow-[#E07A5F]/20 transition-all flex items-center space-x-2 transform active:scale-95 text-xs tracking-wider">
                        <i class="fa-solid fa-play"></i>
                        <span data-i18n="startBtn">시스템 가동하기</span>
                    </button>
                </div>

                <!-- Webcam Display Area -->
                <div class="relative aspect-video w-full bg-black/5 rounded-2xl overflow-hidden border border-black/5 flex items-center justify-center shadow-inner">
                    <div id="webcam-container" class="w-full h-full flex items-center justify-center">
                        <div id="placeholderText" class="text-center p-6 opacity-40 flex flex-col items-center space-y-3">
                            <i class="fa-solid fa-eye text-4xl text-[#E07A5F]"></i>
                            <p class="text-xs font-medium tracking-wide" data-i18n="placeholder">버튼을 눌러 웜톤 비전 센서를 활성화하세요.</p>
                        </div>
                    </div>
                    <!-- Status Badge -->
                    <div class="absolute top-4 left-4 backdrop-blur-md border px-3 py-1.5 rounded-full text-[11px] font-medium flex items-center space-x-2 shadow-sm" style="background-color: var(--bg-card); border-color: var(--border-card);">
                        <span class="w-2 h-2 rounded-full bg-amber-500" id="statusDot"></span>
                        <span id="statusText" data-i18n="statusStandby">대기 중</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Visualization Mechanism (Neural Core & Velocity) -->
        <div class="lg:col-span-5 flex flex-col space-y-6">
            <div class="warm-card rounded-3xl p-6 flex flex-col items-center text-center relative">
                <h2 class="modern-font text-sm font-bold flex items-center space-x-2 mb-6 tracking-wide w-full justify-start">
                    <i class="fa-solid fa-atom text-[#E07A5F]"></i>
                    <span data-i18n="analyticsTitle">NEURAL PULSE REACTOR</span>
                </h2>

                <!-- 중앙 집중형 코어 링 -->
                <div class="relative w-48 h-48 my-4 flex items-center justify-center">
                    <div id="pulseCoreRing" class="absolute inset-0 rounded-full border-4 border-dashed border-[#E07A5F]/30 pulse-reactor"></div>
                    <div class="absolute inset-3 rounded-full flex flex-col items-center justify-center shadow-inner transition-all duration-300" style="background-color: var(--accent-sub);">
                        <span id="coreTopLabel" class="text-xs font-bold uppercase opacity-60 tracking-wider">READY</span>
                        <span id="coreMainProb" class="modern-font text-3xl font-extrabold text-[#E07A5F] my-1">0.0%</span>
                        <span id="coreSubClass" class="text-[11px] font-medium px-3 truncate max-w-[140px]" style="color: var(--text-sub);">-</span>
                    </div>
                </div>

                <!-- 실시간 변화 속도 (Velocity) 지표 표시 (조정 바 제외) -->
                <div class="w-full mt-4 pt-4 border-t flex justify-between items-center text-xs font-semibold" style="border-color: var(--border-card);">
                    <span class="flex items-center space-x-1.5 opacity-80">
                        <i class="fa-solid fa-gauge-high text-[#E07A5F]"></i>
                        <span data-i18n="velocityLabel">실시간 변화 속도 (Velocity)</span>
                    </span>
                    <span id="velocityValue" class="text-[#E07A5F] font-bold font-mono">0.0 px/s</span>
                </div>
            </div>

            <!-- 하단 미세 분석 리스트 칩 -->
            <div id="label-container" class="warm-card rounded-2xl p-4 grid grid-cols-2 gap-3">
                <div class="col-span-2 text-center py-4 text-xs opacity-40 font-medium" data-i18n="waitingModel">
                    모델 동기화 대기 중...
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t py-6 text-center text-xs opacity-50 transition-colors" style="border-color: var(--border-card);">
        <p>&copy; 2026 NEO-VISION WARM AI LABS. ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- TensorFlow.js and Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const translations = {
            ko: {
                subtitle: "웜톤 모던 AI 스튜디오",
                feedTitle: "광학 센서 스트림",
                startBtn: "시스템 가동하기",
                placeholder: "버튼을 눌러 웜톤 비전 센서를 활성화하세요.",
                statusStandby: "대기 중",
                statusActive: "AI 뉴럴 가동 중",
                analyticsTitle: "뉴럴 펄스 리액터",
                velocityLabel: "실시간 변화 속도",
                waitingModel: "모델 동기화 대기 중..."
            },
            en: {
                subtitle: "Warm Modern AI Studio",
                feedTitle: "OPTICAL SENSOR STREAM",
                startBtn: "SYSTEM LAUNCH",
                placeholder: "Click to activate warm vision sensor.",
                statusStandby: "STANDBY",
                statusActive: "NEURAL ACTIVE",
                analyticsTitle: "NEURAL PULSE REACTOR",
                velocityLabel: "Real-time Velocity",
                waitingModel: "Waiting for synchronization..."
            }
        };

        let currentLang = 'ko';
        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            updateTexts();
        });

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        // 테마 토글 (태양 / 초승달 아이콘 전환)
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                htmlElement.setAttribute('data-theme', 'dark');
                themeIcon.className = "fa-solid fa-moon text-indigo-300 text-sm";
            } else {
                htmlElement.setAttribute('data-theme', 'light');
                themeIcon.className = "fa-solid fa-sun text-amber-500 text-sm";
            }
        });

        // 사용자가 제공한 티처블 머신 공유 링크 적용 완료
        const URL = "https://teachablemachine.withgoogle.com/models/QUqC192tV/";

        let model, webcam, labelContainer, maxPredictions;
        let isInitialized = false;
        let lastTopProb = 0;
        let lastTime = Date.now();

        async function init() {
            if (isInitialized) return;
            
            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;
            startBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> SYNCING...`;

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true;
                webcam = new tmImage.Webcam(420, 315, flip);
                await webcam.setup();
                await webcam.play();
                
                const webcamContainer = document.getElementById("webcam-container");
                webcamContainer.innerHTML = "";
                webcamContainer.appendChild(webcam.canvas);

                isInitialized = true;
                document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]";
                document.getElementById('statusText').innerText = currentLang === 'ko' ? "AI 뉴럴 가동 중" : "NEURAL ACTIVE";
                startBtn.style.display = 'none';

                window.requestAnimationFrame(loop);

            } catch (error) {
                console.error("Initialization error:", error);
                alert(currentLang === 'ko' ? "모델 동기화 실패! 네트워크 상태를 확인하세요." : "Model sync failed! Please check your network.");
                startBtn.disabled = false;
                startBtn.innerHTML = `<i class="fa-solid fa-play"></i> ${translations[currentLang].startBtn}`;
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let topPrediction = prediction[0];
            for (let i = 1; i < maxPredictions; i++) {
                if (prediction[i].probability > topPrediction.probability) {
                    topPrediction = prediction[i];
                }
            }

            const currentProbVal = topPrediction.probability;
            const percentage = (currentProbVal * 100).toFixed(1);

            document.getElementById('coreTopLabel').innerText = currentLang === 'ko' ? "현재 인식 상태" : "ACTIVE STATE";
            document.getElementById('coreMainProb').innerText = `${percentage}%`;
            document.getElementById('coreSubClass').innerText = topPrediction.className.toUpperCase();
            
            const pulseRing = document.getElementById('pulseCoreRing');
            const scaleFactor = 1 + (currentProbVal * 0.1);
            pulseRing.style.transform = `scale(${scaleFactor})`;

            const now = Date.now();
            const timeDiff = (now - lastTime) / 1000;
            if (timeDiff > 0.1) {
                const probDiff = Math.abs(currentProbVal - lastTopProb);
                const velocity = ((probDiff / timeDiff) * 100).toFixed(1);
                
                document.getElementById('velocityValue').innerText = `${velocity} px/s`;
                lastTopProb = currentProbVal;
                lastTime = now;
            }

            let subHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const p = (prediction[i].probability * 100).toFixed(0);
                subHTML += `
                    <div class="p-2.5 rounded-xl border flex items-center justify-between text-xs" style="background-color: var(--accent-sub); border-color: var(--border-card);">
                        <span class="font-medium truncate max-w-[90px]">${prediction[i].className}</span>
                        <span class="font-bold text-[#E07A5F]">${p}%</span>
                    </div>
                `;
            }
            document.getElementById('label-container').innerHTML = subHTML;
        }
    </script>
</body>
</html>
