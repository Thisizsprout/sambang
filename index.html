<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-VISION | AI Analytics Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Orbitron & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Orbitron', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .futuristic-font {
            font-family: 'Orbitron', sans-serif;
        }
        .glow-box {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .dark .glow-box {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .scanner-line {
            background: linear-gradient(to bottom, transparent, rgba(16, 185, 129, 0.4), transparent);
            height: 20px;
            width: 100%;
            position: absolute;
            top: -20px;
            animation: scan 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: -20px; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-microchip text-slate-950 text-xl"></i>
                </div>
                <div>
                    <span class="futuristic-font text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">NEO-VISION AI</span>
                    <span class="block text-[10px] text-emerald-400 tracking-widest font-mono font-semibold" data-i18n="subtitle">REALTIME NEURAL ENGINE</span>
                </div>
            </div>

            <!-- Controls: Theme & Language -->
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <select id="langSelect" class="bg-slate-900/90 border border-slate-700/80 text-slate-200 text-xs rounded-xl focus:ring-emerald-500 focus:border-emerald-500 block px-3 py-2.5 outline-none cursor-pointer transition font-mono">
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="en">🇺🇸 English</option>
                    </select>
                </div>

                <button id="themeToggle" class="w-10 h-10 rounded-xl bg-slate-900/90 border border-slate-700/80 flex items-center justify-center text-slate-300 hover:text-emerald-400 hover:border-emerald-500/50 transition">
                    <i id="themeIcon" class="fa-solid fa-sun text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8 items-start w-full">
        
        <!-- Left: Webcam & Live View -->
        <div class="lg:col-span-7 flex flex-col space-y-6">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-2xl p-6 glow-box relative overflow-hidden">
                <div class="scanner-line"></div>
                <div class="absolute -right-20 -top-20 w-56 h-56 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="flex items-center justify-between mb-5">
                    <h2 class="futuristic-font text-sm font-bold flex items-center space-x-2 text-slate-200 tracking-wider">
                        <i class="fa-solid fa-video text-emerald-400"></i>
                        <span data-i18n="feedTitle">OPTICAL SENSOR FEED</span>
                    </h2>
                    
                    <button id="startBtn" onclick="init()" class="bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center space-x-2 transform active:scale-95 text-xs font-mono tracking-wider">
                        <i class="fa-solid fa-power-off"></i>
                        <span data-i18n="startBtn">SYSTEM LAUNCH</span>
                    </button>
                </div>

                <!-- Webcam Display Area -->
                <div class="relative aspect-video w-full bg-slate-950 rounded-xl overflow-hidden border border-slate-800/80 flex items-center justify-center shadow-inner">
                    <div id="webcam-container" class="w-full h-full flex items-center justify-center">
                        <div id="placeholderText" class="text-center p-6 text-slate-500 flex flex-col items-center space-y-3">
                            <i class="fa-solid fa-fingerprint text-5xl animate-pulse text-emerald-500/40"></i>
                            <p class="text-xs font-mono tracking-wide" data-i18n="placeholder">CLICK 'SYSTEM LAUNCH' TO ACTIVATE CAMERA & AI</p>
                        </div>
                    </div>
                    <!-- Status Badge -->
                    <div class="absolute top-4 left-4 bg-slate-950/80 backdrop-blur-md border border-slate-800 px-3 py-1.5 rounded-full text-[11px] font-mono text-slate-300 flex items-center space-x-2 shadow-lg">
                        <span class="w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]" id="statusDot"></span>
                        <span id="statusText" data-i18n="statusStandby">STANDBY</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Real-time Analytics & Probabilities -->
        <div class="lg:col-span-5 flex flex-col space-y-6">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-2xl p-6 glow-box">
                <h2 class="futuristic-font text-sm font-bold flex items-center space-x-2 mb-6 text-slate-200 tracking-wider">
                    <i class="fa-solid fa-chart-pie text-emerald-400"></i>
                    <span data-i18n="analyticsTitle">NEURAL PROBABILITY MATRIX</span>
                </h2>

                <!-- Label & Progress Bar Container -->
                <div id="label-container" class="space-y-4">
                    <div class="text-slate-500 text-xs text-center py-10 font-mono tracking-wide" data-i18n="waitingModel">
                        WAITING FOR NEURAL MODEL SYNCHRONIZATION...
                    </div>
                </div>
            </div>

            <!-- System Diagnostic Info -->
            <div class="bg-slate-900/30 border border-slate-800/60 rounded-xl p-4 text-[11px] text-slate-400 flex items-center justify-between font-mono">
                <span class="flex items-center space-x-2">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                    <span>MODEL: TM-CLOUD-LINK</span>
                </span>
                <span class="text-emerald-400 font-bold">SECURE v2.4</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500 font-mono">
        <p>&copy; 2026 NEO-VISION AI LABS. ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- TensorFlow.js and Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const translations = {
            ko: {
                subtitle: "실시간 뉴럴 비전 엔진",
                feedTitle: "광학 센서 비전 피드",
                startBtn: "시스템 가동하기",
                placeholder: "'시스템 가동하기' 버튼을 눌러 카메라와 AI를 연동하세요.",
                statusStandby: "대기 중",
                statusActive: "AI 뉴럴 네트워크 가동 중",
                analyticsTitle: "뉴럴 확률 매트릭스",
                waitingModel: "시스템이 가동되면 실시간 분석 데이터가 여기에 출력됩니다."
            },
            en: {
                subtitle: "REALTIME NEURAL ENGINE",
                feedTitle: "OPTICAL SENSOR FEED",
                startBtn: "SYSTEM LAUNCH",
                placeholder: "CLICK 'SYSTEM LAUNCH' TO ACTIVATE CAMERA & AI",
                statusStandby: "STANDBY",
                statusActive: "NEURAL NET ACTIVE",
                analyticsTitle: "NEURAL PROBABILITY MATRIX",
                waitingModel: "WAITING FOR NEURAL MODEL SYNCHRONIZATION..."
            }
        };

        let currentLang = 'ko';

        document.getElementById('langSelect').addEventListener('change', (e) => {
            currentLang = e.target.value;
            updateTexts();
        });

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.setAttribute('data-theme', 'light');
                themeIcon.className = 'fa-solid fa-moon text-sm';
                document.body.classList.remove('bg-slate-950', 'text-slate-100');
                document.body.classList.add('bg-slate-100', 'text-slate-900');
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun text-sm';
                document.body.classList.remove('bg-slate-100', 'text-slate-900');
                document.body.classList.add('bg-slate-950', 'text-slate-100');
            }
        });

        // =====================================================================
        // 💡 [사용법] 티처블 머신에서 모델 학습 후 [Export Model] -> [TensorFlow.js] 
        // -> [Upload my model]을 누르면 나오는 공유 링크를 아래 URL에 붙여넣으세요!
        // 이 방식을 쓰면 폴더를 따로 만들 필요 없이 index.html 파일 하나로 끝납니다.
        // =====================================================================
        const URL = "https://teachablemachine.withgoogle.com/models/https://thisizsprout.github.io/sambang//";

        let model, webcam, labelContainer, maxPredictions;
        let isInitialized = false;

        async function init() {
            if (isInitialized) return;

            if (URL.includes("여기에_본인의_공유링크를_넣으세요")) {
                alert("코드 내부의 'URL' 변수에 티처블 머신 공유 링크를 입력해야 정상 작동합니다!");
                return;
            }
            
            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;
            startBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> SYNCING...`;

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true;
                webcam = new tmImage.Webcam(420, 315, flip);
                await webcam.setup();
                await webcam.play();
                
                const webcamContainer = document.getElementById("webcam-container");
                webcamContainer.innerHTML = "";
                webcamContainer.appendChild(webcam.canvas);

                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "space-y-1.5";
                    wrapper.innerHTML = `
                        <div class="flex justify-between text-xs font-bold font-mono">
                            <span id="label-name-${i}" class="text-slate-300">CLASS_${i+1}</span>
                            <span id="label-prob-${i}" class="text-emerald-400">0.0%</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800 shadow-inner">
                            <div id="bar-${i}" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-2 rounded-full transition-all duration-75" style="width: 0%"></div>
                        </div>
                    `;
                    labelContainer.appendChild(wrapper);
                }

                isInitialized = true;
                document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.8)] animate-pulse";
                document.getElementById('statusText').innerText = currentLang === 'ko' ? "AI 뉴럴 네트워크 가동 중" : "NEURAL NET ACTIVE";
                startBtn.style.display = 'none';

                window.requestAnimationFrame(loop);

            } catch (error) {
                console.error("Initialization error:", error);
                alert(currentLang === 'ko' ? "모델 동기화 실패! 티처블 머신 공유 링크(URL)를 확인하세요." : "Model sync failed! Please check your Teachable Machine share URL.");
                startBtn.disabled = false;
                startBtn.innerHTML = `<i class="fa-solid fa-power-off"></i> ${translations[currentLang].startBtn}`;
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = (prediction[i].probability * 100).toFixed(1);

                const nameEl = document.getElementById(`label-name-${i}`);
                const probEl = document.getElementById(`label-prob-${i}`);
                const barEl = document.getElementById(`bar-${i}`);

                if (nameEl && probEl && barEl) {
                    nameEl.innerText = className.toUpperCase();
                    probEl.innerText = `${probability}%`;
                    barEl.style.width = `${probability}%`;
                }
            }
        }
    </script>
</body>
</html>
